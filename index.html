<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahyan's Expense</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js');
    }
  </script>
  <style>
  html {
    overflow-y: scroll;
    }
    @keyframes slideUp {
    from {
      transform: translateY(100%);
      opacity: 0;
    }
    to {
      transform: translateY(0);
      opacity: 1;
    }
  }

  .modal-content {
    animation: slideUp 0.3s ease-out;
  }
</style>
</head>

<body class="bg-gray-950 text-white min-h-screen">

  <div class="max-w-md mx-auto px-4 pb-20">

    <!-- Header -->
    <div class="py-6 relative flex items-center">
      <div class="absolute left-0 right-0 text-center pointer-events-none">
        <h1 class="text-2xl font-bold">Ahyan's Expense</h1>
        <p id="tanggal-hari-ini" class="text-gray-400 text-sm mt-1"></p>
      </div>
      <div class="ml-auto relative z-10">
        <button onclick="bukaFilterBulan()" id="btn-filter-bulan"
          class="bg-gray-800 rounded-xl px-3 py-2 text-sm font-bold text-yellow-400 flex items-center gap-1">
          <span id="label-filter-bulan">Jul</span>
          <span>▼</span>
        </button>
      </div>
    </div>

    <!-- TAB HOME -->
    <div id="konten-home">
      <div class="bg-gray-800 rounded-2xl p-5 mb-6">
        <h2 id="total" class="text-3xl font-bold text-center"></h2>
      </div>
      <div id="daftar-pengeluaran" class="flex flex-col gap-3"></div>
    </div>

    <!-- TAB REPORTS -->
    <div id="konten-reports" style="display:none">
      <div class="bg-gray-800 rounded-2xl p-5 mb-4">
        <p class="text-gray-400 text-sm mb-1">Total Pengeluaran</p>
        <p id="label-bulan-reports" class="text-yellow-400 text-xs mb-2"></p>
        <h2 id="total-reports" class="text-3xl font-bold text-white"></h2>
      </div>
      <div class="bg-gray-800 rounded-2xl p-5 mb-4">
        <h2 class="text-lg font-bold mb-4">Pengeluaran per Kategori</h2>
        <div class="relative" style="height: 250px;">
          <canvas id="chart-kategori"></canvas>
        </div>
      </div>
      <div class="bg-gray-800 rounded-2xl p-5">
        <h2 class="text-lg font-bold mb-4">Ringkasan</h2>
        <div id="ringkasan-kategori" class="flex flex-col gap-3"></div>
      </div>
    </div>
    
    <!-- TAB SETTINGS -->
    <div id="konten-settings" style="display:none">
      <div class="bg-gray-800 rounded-2xl p-5 flex flex-col gap-3">
        <h2 class="text-lg font-bold">Data & Backup</h2>
        <button onclick="exportData()"
          class="bg-gray-700 text-white font-bold rounded-xl py-3 hover:bg-gray-600 transition">
          Export Data
        </button>
        <label class="bg-gray-700 text-white font-bold rounded-xl py-3 hover:bg-gray-600 transition text-center cursor-pointer">
          Import Data
          <input type="file" accept=".json" onchange="importData(event)" class="hidden">
        </label>
      </div>
    </div>

  </div>

  <!-- Popup Filter Bulan -->
<div id="popup-bulan" class="fixed inset-0 z-40 hidden items-center justify-center" style="background: rgba(0,0,0,0.5);">
  <div class="bg-gray-900 rounded-3xl p-6 w-80">
    
    <!-- Ganti Tahun -->
    <div class="flex justify-between items-center mb-6">
      <button onclick="gantiTahun(-1)" class="text-gray-400 text-2xl px-2">‹</button>
      <span id="label-tahun" class="text-white font-bold text-lg"></span>
      <button onclick="gantiTahun(1)" class="text-gray-400 text-2xl px-2">›</button>
      <button onclick="resetBulan()" class="text-gray-400 ml-2">↺</button>
    </div>

    <!-- Grid Bulan -->
    <div class="grid grid-cols-4 gap-3 mb-6" id="grid-bulan"></div>

    <!-- Tombol -->
    <div class="flex justify-between">
      <button onclick="tutupFilterBulan()" class="text-gray-400 text-xl px-4">✕</button>
      <button onclick="konfirmasiBulan()" class="text-yellow-400 text-xl px-4">✓</button>
    </div>

  </div>
</div>

  <!-- Modal Tambah Transaksi -->
  <div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center" style="background: rgba(0,0,0,0.3); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);">
    <div class="bg-gray-900 w-11/12 max-w-md rounded-3xl p-6 modal-content">
      <div class="flex justify-between items-center mb-6">
        <button onclick="tutupModal()" class="text-gray-400 text-2xl">✕</button>
        <span class="font-bold text-lg">Tambah Pengeluaran</span>
        <div class="w-6"></div>
      </div>
      <div class="bg-gray-800 rounded-2xl px-4 py-3 mb-4 flex items-center gap-3">
        <span class="text-gray-400 font-bold">Rp</span>
        <input type="number" id="input-jumlah" placeholder="0"
          class="bg-transparent text-white text-2xl font-bold outline-none w-full">
      </div>
      <p class="text-gray-400 text-sm mb-3">Pilih Kategori</p>
      <div class="grid grid-cols-4 gap-3 mb-4" id="grid-kategori">
        <button onclick="pilihKategori('Food')" data-kategori="Food"
          class="kategori-btn flex flex-col items-center gap-1 bg-gray-800 rounded-2xl py-3">
          <span class="text-2xl">🍔</span>
          <span class="text-xs text-gray-400">Food</span>
        </button>
        <button onclick="pilihKategori('Beverages')" data-kategori="Beverages"
          class="kategori-btn flex flex-col items-center gap-1 bg-gray-800 rounded-2xl py-3">
          <span class="text-2xl">🧋</span>
          <span class="text-xs text-gray-400">Beverages</span>
        </button>
        <button onclick="pilihKategori('Transport')" data-kategori="Transport"
          class="kategori-btn flex flex-col items-center gap-1 bg-gray-800 rounded-2xl py-3">
          <span class="text-2xl">🚗</span>
          <span class="text-xs text-gray-400">Transport</span>
        </button>
        <button onclick="pilihKategori('Fun/Travel')" data-kategori="Fun/Travel"
          class="kategori-btn flex flex-col items-center gap-1 bg-gray-800 rounded-2xl py-3">
          <span class="text-2xl">✈️</span>
          <span class="text-xs text-gray-400">Fun/Travel</span>
        </button>
        <button onclick="pilihKategori('Skincare')" data-kategori="Skincare"
          class="kategori-btn flex flex-col items-center gap-1 bg-gray-800 rounded-2xl py-3">
          <span class="text-2xl">🧴</span>
          <span class="text-xs text-gray-400">Skincare</span>
        </button>
      </div>
      <div class="flex flex-col gap-3 mb-6">
        <input type="date" id="input-tanggal"
          class="bg-gray-800 rounded-xl px-4 py-3 text-white outline-none">
        <input type="text" id="input-catatan" placeholder="Tambah catatan..."
          class="bg-gray-800 rounded-xl px-4 py-3 text-white placeholder-gray-400 outline-none">
      </div>
      <button onclick="tambahPengeluaran()"
        class="w-full bg-yellow-400 text-gray-900 font-bold rounded-2xl py-4 text-lg">
        Simpan
      </button>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 bg-gray-900 border-t border-gray-700">
    <div class="max-w-md mx-auto flex items-center">
      <button onclick="gantiTab('home')" id="tab-home"
        class="flex-1 flex flex-col items-center py-3 text-yellow-400">
        <span class="text-xl">🏠</span>
        <span class="text-xs mt-1">Home</span>
      </button>
      <button onclick="gantiTab('reports')" id="tab-reports"
        class="flex-1 flex flex-col items-center py-3 text-gray-500">
        <span class="text-xl">📊</span>
        <span class="text-xs mt-1">Reports</span>
      </button>
      <button onclick="bukaModal()"
        class="flex-1 flex flex-col items-center -mt-6">
        <span class="bg-yellow-400 text-gray-900 text-3xl font-bold w-14 h-14 rounded-full flex items-center justify-center shadow-lg">+</span>
      </button>
      <button onclick="gantiTab('settings')" id="tab-settings"
        class="flex-1 flex flex-col items-center py-3 text-gray-500">
        <span class="text-xl">⚙️</span>
        <span class="text-xs mt-1">Settings</span>
      </button>
      <button class="flex-1 flex flex-col items-center py-3 text-gray-500">
        <span class="text-xl">👤</span>
        <span class="text-xs mt-1">Mine</span>
      </button>
    </div>
  </nav>

  <script src="app.js"></script>
</body>
</html>
